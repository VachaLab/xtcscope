[project]
name = "xtcscope"
description = "View the last frames of a running GROMACS job."
license = "MIT"
requires-python = ">=3.13"
dependencies = ["qq"]
dynamic = ["version"]

[project.scripts]
xtcscope = "xtcscope.cli:main"

[dependency-groups]
dev = ["pyinstaller>=6.16.0", "pytest>=8.4.2", "ruff>=0.17.1", "ty>=0.0.90"]

[tool.uv.sources]
qq = { git = "https://github.com/VachaLab/qq.git", tag = "v0.13.0" }

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "src/xtcscope/__init__.py"

[tool.hatch.metadata]
# qq is a git dependency.
allow-direct-references = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
target-version = "py313"
line-length = 100
# first-party code: the package and the tests' conftest
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]

[tool.ty.src]
# the qq stand-in for subprocess tests shadows the real qq_lib on purpose
exclude = ["tests/stubs"]
