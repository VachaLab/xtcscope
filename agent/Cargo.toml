[package]
name = "xtcscope-agent"
version = "0.2.0-alpha.3"
edition = "2024"
rust-version = "1.88"
description = "Copies the last frames of a GROMACS XTC trajectory"
publish = false

[[bin]]
name = "xtcscope-agent"
path = "src/main.rs"

[lib]
name = "xtcscope_agent"
path = "src/lib.rs"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
# writes real compressed frames for the fixtures, and reads them back as a reference
molly = "=0.7.0"
tempfile = "3"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
